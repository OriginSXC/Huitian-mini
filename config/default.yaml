# 每日早报配置
daily:
  time: '0 30 9 * * *'
  groupList: [] # 请在 config.yaml 中填写需要推送的群号，例如: ['123456', '654321']
  isAutoPush: true

# 摸鱼日历配置
moyu:
  time: '0 0 9 * * *'
  groupList: [] # 请在 config.yaml 中填写需要推送的群号，例如: ['123456', '654321']
  isAutoPush: true

# 米游社Cos配置
mys_cos:
  SEND_MODE_DEFAULT: 'forward-icqq'
  ALLOW_CMD_SWITCH_MODE: true
  BATCH_SIZE: 10
  DELAY_MS: 1500
  MAX_TOTAL: 5
  SIZE_TIPS: true
  SIZE_MB_TIP: 15
  HEADER_IN_EACH_BATCH: true
  AUTO_CRON: '30 8 12 * * *'
  SHARP_ENABLE: true
  SHARP_OUTPUT_FORMAT: 'webp'
  SHARP_QUALITY_START: 82
  SHARP_QUALITY_MIN: 50
  SHARP_MAX_WIDTH: 1440
  SHARP_MAX_HEIGHT: 1920
  SHARP_CROP_TO_RATIO: true
  SHARP_TARGET_RATIO: 0.75 # 即 3/4
  SHARP_MAX_BYTES: 1677722 # 1.6 * 1024 * 1024
  SHARP_PROGRESSIVE_JPG: true
  SHARP_POSITION: 'attention'
  API_TIMEOUT_MS: 8000           # 帖子列表接口单次超时，失败自动重试 3 次
  IMG_TIMEOUT_MS: 20000          # 单张图片下载超时
  IMG_CONCURRENCY: 3             # 同时处理几张图
  # 请在 config.yaml 中配置推送目标，格式为 群号: 'group' 或 QQ号: 'private'  
  POSTLIST: {} 
  # 例如：123456578: 'group'
  # 例如：87654321: 'private'

# 卧槽图片配置
woc:
  BATCH_SIZE: 5
  DELAY_MS: 1600
  MAX_TOTAL: 10
  USE_SHARP: true
  FORCE_BASE64: true
  PREFER_ICQQ_FORWARD: true
  FETCH_TIMEOUT_MS: 100000
  JPEG_WIDTH: 1080
  JPEG_QUALITY: 70
  API_TIMEOUT_MS: 15000          # 图源 API 超时（毫秒），超时即切下一个源
  # ---- 单张图下载的重试与节流 ----
  DOWNLOAD_RETRY: 2              # 重试次数，只对 429 限流 / 408 / 5xx / 超时重试；404、403 直接放弃
  DOWNLOAD_RETRY_DELAY_MS: 1000  # 重试基础退避，指数增长 + 抖动；服务端给了 Retry-After 优先听它的
  DOWNLOAD_GAP_MS: 250           # 图间隔全局默认；各源可用下面的 *_DOWNLOAD_GAP_MS 单独覆盖
  REFILL_BUDGET: 40              # 单次 #woc 最多下载尝试次数——死链会一直换下一张，这是安全上限
  GROUP_RETRY: 2                 # 整组图全是死链时，最多再换几组（换组才可能真出图）
  POOL_REBUILD: 2                # 整池的组都失效后，最多自动重新抓几次新池（不用用户再发一次）
  DEAD_STREAK: 5                 # 连续几张死链就判定整组已被删，立刻换组（图集是整套传的，不必把几十张全试一遍）
  LIMIT_STREAK: 3                # 连续几张被限流(429)才放弃；单张 429 不代表下一张也拿不到
  BYPASS_PHOTON: true            # i*.wp.com 代理对个别图永久返回 429（换节点/等待都没用），还原成源站直链
  # ---- 取大图：站点正文里常年给的是缩略图，sharp 拿缩略图放大没有意义 ----
  KUP_MAX_AGE_DAYS: 420          # 4kup 帖子超过这么多天，Blogger 图已被清（实测 2025-01 前全 404）；0=不限
  KUP_IMG_SIZE: s0               # 4kup 正文是 400x600 缩略图，s0=原图 1067x1600
  KHD_IMG_SIZE: s0               # 4khd 正文是 w1300，s0=原图 1920x2560（注意 s1600 反而更小）
  COSERLAB_FULL_SIZE: true       # coserlab 去掉 -scaled 取原图（1440x2560 → 2160x3840）
  FAIL_LINK_ONLY_WHEN_EMPTY: true # 只有一张图都没发出时才发降级链接；已发满就不再刷屏
  DROP_DEAD_IMAGES: true         # 404/410 这类死链直接剔除，不再降级发链接（链接点开也是 404）
  DEAD_STATUS: [404, 410]        # 视为「永久失效」的状态码；429/超时不算，那些 URL 还是活的
  FALLBACK_ENABLE: true          # true=某个源挂了就换下一个；false=只试随机挑中的那一个，挂了就算了

  # ================= R18 总开关 =================
  # false：各源只用「非 R18 分类」（cosplay 那一档），下面 *_CATEGORIES_R18 里的分类完全不碰
  # true ：把 *_CATEGORIES_R18 也并进候选分类
  R18_ENABLE: false
  # R18 私聊开关：true = R18 分类只在私聊放开，群聊自动降级回非 R18（cosplay 那档）
  #               false = 群聊私聊一视同仁，只看 R18_ENABLE
  R18_PRIVATE_ONLY: true
  # R18 输出概率（0~1）：允许 R18 的场合，每次按这个概率决定本轮出不出 R18。
  # 掷中时只从「配了 R18 分类的源」里随机挑，且只用 R18 分类，不掺 cosplay，
  # 所以这个数字就是实打实的出图率。0.3 = 三成出 R18；1 = 每次都出；0 = 等于关掉。
  # 若掷中时一个 R18 源都没有（全禁用/全冷却），会自动降级走非 R18，不会报错。
  R18_RATE: 0.3
  # R18 那档在一组图里怎么挑 5 张：random=随机 / reverse=倒序 / order=按原顺序
  # 图集开头往往最平淡，默认 random
  R18_PICK_ORDER: random
  # 普通档在一组图里怎么挑：random=随机 / reverse=倒序 / order=按原顺序
  PICK_ORDER: random

  # ================= 图源选取 =================
  # 候选图源清单，删掉某个 key 即等于不用它
  # mikagogo 暂时摘掉：它正文常抠不到图，要退回媒体库取封面，一组里 5 张会来自不同文章、不成套。
  # 想恢复就把 mikagogo 加回列表（两个 yaml 都要改，见下方说明）
  SOURCE_ORDER: [main, coserlab, 4khd, 4kup]
  # random = 每次随机挑一个源（默认），挂了再随机换下一个；order = 按上面的顺序依次试
  SOURCE_PICK: random
  # 某个源抓挂后冷却多少秒：冷却期内不是被丢掉，而是排到最后，全挂时还能兜住。0 = 不冷却
  SOURCE_FAIL_COOLDOWN: 600
  # 选源权重：数字越大越容易被抽中，缺省 1。R18 轮次优先查 SOURCE_WEIGHTS_R18。
  # 权重 0 = 平时不抽，只在其它源全挂时兜底。
  SOURCE_WEIGHTS: {}
  SOURCE_WEIGHTS_R18:
    4khd: 5                      # R18 档体量数万篇
    4kup: 1                      # R18 档只有 259 篇，抽中概率压到 1/6

  # ---- main：主站 shaonvzhi ----
  SNZ_BASE: https://shaonvzhi.top/wp-json/wp/v2
  SNZ_DOWNLOAD_GAP_MS: 250       # 该源的图间隔，留空则用全局 DOWNLOAD_GAP_MS

  # ---- coserlab（正文内嵌整套图集，一篇=一组）----
  COSERLAB_ENABLE: true
  COSERLAB_BASE: https://coserlab.io/wp-json/wp/v2
  COSERLAB_CATEGORIES: [1, 5]    # 1=cosplay 5=portrait，每次随机取一个
  COSERLAB_REFERER: https://coserlab.io/
  COSERLAB_POSTS_PER_PAGE: 5
  COSERLAB_DOWNLOAD_GAP_MS: 250  # autoselect.nian.nz 不限流，可以快

  # ---- mikagogo ----
  MIKAGOGO_ENABLE: true
  MIKAGOGO_BASE: https://mikagogo.com/wp-json/wp/v2
  MIKAGOGO_CATEGORY: 12          # cosplay
  MIKAGOGO_POSTS_PER_PAGE: 20
  MIKAGOGO_DOWNLOAD_GAP_MS: 250

  # ---- 4khd（正文一篇内嵌整套图，实测 10~200 张）----
  # cosplay(4) 放在非 R18 档，R18 关着也能抓；其余分类只在 R18 开时才并进来。
  KHD_ENABLE: true
  KHD_BASES:                     # 主域被 WAF 挡了自动换第二个（4khd 的跳转站）
    - https://www.4khd.com/wp-json/wp/v2
    - https://hecoq.uuss.uk/wp-json/wp/v2
  KHD_CATEGORIES: [4]            # 非 R18 档：4=cosplay
  KHD_CATEGORIES_R18: [3, 21, 9, 26]  # R18 档分类 ID（含义见站点自身分类页，此处不展开）
  KHD_REFERER: https://www.4khd.com/
  KHD_POSTS_PER_PAGE: 2
  KHD_DOWNLOAD_GAP_MS: 250       # 绕过 Photon 直连源站后不再限流，实测 0ms 间隔也 10/10

  # ---- 4kup（正文内嵌整套图，实测 14~37 张/篇）----
  # AI 图在接口层就用 categories_exclude 排掉，再加一道标题正则兜底。
  KUP_ENABLE: true
  KUP_BASE: https://4kup.net/wp-json/wp/v2
  KUP_CATEGORIES: [2940, 10, 2939, 434, 2772]
    # 非 R18 档：2940=Coser 10=Chinese 2939=Asian 434=XIUREN 2772=Korean
  KUP_CATEGORIES_R18: [7064, 4524]
    # R18 档分类 ID（含义见站点自身分类页，此处不展开）
  KUP_EXCLUDE_CATEGORIES: [7253, 7295, 4450, 6780, 6723, 6649, 6648]
    # 要排掉的 AI 分类：AI / AI Enhanced / AI Generated / AI girls / AIgirl / AIgirls / AIPD
  KUP_REFERER: https://4kup.net/
  KUP_POSTS_PER_PAGE: 3
  KUP_DOWNLOAD_GAP_MS: 250       # blogger.googleusercontent.com 不限流


# 小姐姐图片配置
xjj:
  BATCH_SIZE: 3
  IMG_COUNT_MIN: 3
  IMG_COUNT_MAX: 5
  USE_SHARP: true
  SHARP_QUALITY: 70
  SHARP_WIDTH: 1080
  FETCH_TIMEOUT: 8000
  DOWNLOAD_TIMEOUT: 15000
  SOURCE_COOLDOWN_MIN: 10        # 图源失败后冷却分钟数（连续失败翻倍，最长 6 小时），冷却中的只在其它图源全挂时兜底
  VIDEO_MAX_TRIES: 4             # 视频遇到死链时最多换几条


xjj_r18:
  CMD_PREFIX: 'r18xjj'   # 主命令前缀：#r18xjj（图片）、#r18xjjpro（视频）
  ENABLE: true
  PRIVATE_ONLY: true        # true：只在私聊开放；false：群聊也放
  GROUP_SILENT: true         # true：群里完全静默不接话（默认关闭）；false：群里回一句提示
  BASE_URL: 'https://www.fantasyfactory.xyz'

  IMG_COUNT_MIN: 3
  IMG_COUNT_MAX: 6
  BATCH_SIZE: 4             # 每批合并转发条数，同时也是下载并发
  DELAY_MS: 1200            # 批间隔

  USE_SHARP: true
  SHARP_QUALITY: 72
  SHARP_WIDTH: 1080
  SHARP_MAX_BYTES: 1638400  # 超过就再压一档

  FETCH_TIMEOUT: 15000
  DOWNLOAD_TIMEOUT: 30000
  DOWNLOAD_RETRY: 2         # 仅对 429/408/5xx/超时重试
  DOWNLOAD_GAP_MS: 200
  REFILL_BUDGET: 20         # 单次最多尝试下载张数
  PICK_ORDER: random        # random / order / reverse

  # 目录索引：49 个月份目录抓一轮约 30s，缓存 24h
  INDEX_TTL_HOURS: 24
  INDEX_MAX_MONTHS: 0       # 0 = 全部；>0 只索引最近的 N 个月
  INDEX_CONCURRENCY: 3
  INDEX_GAP_MS: 150
  SET_MEDIA_TTL_MIN: 120
  SET_CACHE_MAX: 60

  # 视频：站点自带文件与合成幻灯片按 VIDEO_NATIVE_RATE 分配，互相兜底
  VIDEO_ENABLE: true
  VIDEO_SYNTH: true
  VIDEO_SYNTH_IMAGES: 10
  VIDEO_SEC_PER_IMG: 2
  VIDEO_WIDTH: 1080
  VIDEO_HEIGHT: 1920
  VIDEO_FPS: 25
  VIDEO_PRESET: 'veryfast'   # veryfast / superfast / ultrafast，越快画质越糊
  FFMPEG_PATH: 'ffmpeg'
  FFMPEG_QUIET: true
  VIDEO_TIMEOUT_MS: 180000
  MAX_VIDEO_BYTES: 62914560
  VIDEO_PREFER_BYTES: 26214400
